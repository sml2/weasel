<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Consolas, 'Courier New', monospace" font-size="12">
  <defs>
    <marker id="arrH" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4" fill="#0d6efd"/></marker>
  </defs>
  <text x="20" y="18" fill="#495057" font-size="11">←─────────────── 一行候选词（horizontal） ──────────────────→</text>

  <!-- 候选项1 高亮区 -->
  <rect x="30" y="30" width="280" height="90" rx="6" fill="#f0e4d0" stroke="#c08000" stroke-width="1.5"/>
  <text x="245" y="46" fill="#6c757d" font-size="10">round_corner ╮</text>

  <!-- hilite_padding_x 左标注 -->
  <line x1="30" y1="75" x2="60" y2="75" stroke="#dc3545" stroke-width="1.2"/>
  <line x1="30" y1="66" x2="30" y2="84" stroke="#dc3545" stroke-width="1"/>
  <line x1="60" y1="66" x2="60" y2="84" stroke="#dc3545" stroke-width="1"/>

  <!-- 内部文字区 -->
  <rect x="60" y="52" width="220" height="36" rx="3" fill="#fff8" stroke="#ddd"/>
  <text x="72" y="75" fill="#cc6600" font-size="14" font-weight="bold">1.</text>
  <text x="108" y="75" fill="#c08000" font-size="15" font-weight="bold">你好</text>
  <text x="168" y="75" fill="#999" font-size="13">nihao</text>
  <!-- 区域标签 -->
  <text x="72" y="98" fill="#6c757d" font-size="10">label</text>
  <text x="115" y="98" fill="#6c757d" font-size="10">text</text>
  <text x="170" y="98" fill="#6c757d" font-size="10">comment</text>

  <!-- hilite_padding_x 右标注 -->
  <line x1="280" y1="75" x2="310" y2="75" stroke="#dc3545" stroke-width="1.2"/>
  <line x1="280" y1="66" x2="280" y2="84" stroke="#dc3545" stroke-width="1"/>
  <line x1="310" y1="66" x2="310" y2="84" stroke="#dc3545" stroke-width="1"/>

  <!-- hilite_padding_x 标注文字 -->
  <text x="15" y="134" fill="#dc3545" font-size="11">hilite_padding_x</text>
  <text x="260" y="134" fill="#dc3545" font-size="11">hilite_padding_x</text>

  <!-- hilite_padding_y 标注 -->
  <line x1="320" y1="30" x2="320" y2="52" stroke="#dc3545" stroke-width="1.2"/>
  <text x="328" y="44" fill="#dc3545" font-size="10">↕ hilite_padding_y</text>
  <line x1="320" y1="88" x2="320" y2="120" stroke="#dc3545" stroke-width="1.2"/>
  <text x="328" y="110" fill="#dc3545" font-size="10">↕ hilite_padding_y</text>

  <!-- hilite_spacing 标注 -->
  <line x1="92" y1="150" x2="108" y2="150" stroke="#198754" stroke-width="1.5"/>
  <text x="80" y="166" fill="#198754" font-size="10">h_s</text>
  <line x1="148" y1="150" x2="168" y2="150" stroke="#198754" stroke-width="1.5"/>
  <text x="143" y="166" fill="#198754" font-size="10">h_s</text>
  <text x="15" y="180" fill="#198754" font-size="11">h_s = hilite_spacing（标签与文字之间）</text>

  <!-- candidate_spacing -->
  <line x1="310" y1="75" x2="380" y2="75" stroke="#0d6efd" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="320" y="66" fill="#0d6efd" font-size="11" font-weight="bold">candidate_spacing</text>

  <!-- 候选项2 -->
  <rect x="382" y="30" width="280" height="90" rx="6" fill="none" stroke="#ddd" stroke-width="1.5"/>
  <rect x="412" y="52" width="220" height="36" rx="3" fill="#fff8" stroke="#ddd"/>
  <text x="424" y="75" fill="#999" font-size="14">2.</text>
  <text x="460" y="75" fill="#808080" font-size="15">拟好</text>
  <text x="520" y="75" fill="#999" font-size="13">nihao</text>

  <!-- 底部颜色标注 -->
  <text x="100" y="210" fill="#c08000" font-size="11">▇ hilited_candidate_back_color</text>
  <text x="400" y="210" fill="#aaa" font-size="11">▇ candidate_back_color</text>

  <!-- 整体尺寸线 -->
  <line x1="30" y1="240" x2="310" y2="240" stroke="#495057" stroke-width="1"/>
  <text x="120" y="256" fill="#495057" font-size="11">候选项 1</text>
  <line x1="382" y1="240" x2="662" y2="240" stroke="#495057" stroke-width="1"/>
  <text x="475" y="256" fill="#495057" font-size="11">候选项 2</text>
</svg>
