<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="Consolas, 'Courier New', monospace" font-size="12">
  <text x="10" y="18" fill="#6c757d" font-size="11">当 inline_preedit: false 且 prevpage_color / nextpage_color 不为透明时：</text>

  <!-- 窗口 -->
  <rect x="20" y="30" width="440" height="130" rx="6" fill="#ededed" stroke="#c3c3c3" stroke-width="2"/>

  <!-- preedit 行 -->
  <rect x="40" y="45" width="400" height="32" rx="4" fill="#e8e8e8" stroke="#ccc"/>
  <text x="56" y="66" fill="#0d6efd" font-size="16" font-weight="bold">&lt;</text>
  <text x="100" y="66" fill="#808080" font-size="14">ni'hao</text>
  <text x="400" y="66" fill="#0d6efd" font-size="16" font-weight="bold">&gt;</text>
  <!-- 标注 -->
  <text x="470" y="58" fill="#0d6efd" font-size="10">prevpage_color</text>
  <text x="470" y="72" fill="#0d6efd" font-size="10">nextpage_color</text>

  <!-- 分隔线 -->
  <line x1="40" y1="82" x2="440" y2="82" stroke="#ccc" stroke-width="1"/>

  <!-- 候选行 -->
  <text x="56" y="108" fill="#cc6600" font-size="13" font-weight="bold">1.</text>
  <text x="78" y="108" fill="#c08000" font-size="14" font-weight="bold">你好</text>
  <text x="160" y="108" fill="#999" font-size="13">2.</text>
  <text x="182" y="108" fill="#808080" font-size="14">拟好</text>
  <text x="260" y="108" fill="#999" font-size="13">3.</text>
  <text x="282" y="108" fill="#808080" font-size="14">你号</text>

  <!-- 说明 -->
  <text x="40" y="142" fill="#6c757d" font-size="11">is_last_page → "&gt;" 显示为 text_color（置灰）</text>
  <text x="40" y="158" fill="#6c757d" font-size="11">is_first_page → "&lt;" 显示为 text_color（置灰）</text>
</svg>
