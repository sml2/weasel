<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Consolas, 'Courier New', monospace" font-size="12">
  <!-- 窗口外框 -->
  <rect x="10" y="10" width="500" height="400" rx="6" fill="#ededed" stroke="#c3c3c3" stroke-width="2"/>

  <!-- margin_y 上 -->
  <line x1="260" y1="10" x2="260" y2="38" stroke="#dc3545" stroke-width="1.2"/>
  <text x="270" y="28" fill="#dc3545" font-size="11">↑ margin_y</text>

  <!-- margin_x 标注 -->
  <text x="18" y="410" fill="#dc3545" font-size="11">←m_x→</text>
  <text x="430" y="410" fill="#dc3545" font-size="11">←m_x→</text>

  <!-- preedit 区 -->
  <rect x="60" y="40" width="400" height="32" rx="4" fill="#e8e8e8" stroke="#ccc"/>
  <text x="74" y="61" fill="#808080" font-size="13">preedit: ni'hao</text>

  <!-- spacing -->
  <line x1="260" y1="72" x2="260" y2="96" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="270" y="88" fill="#0d6efd" font-size="11" font-weight="bold">↕ spacing</text>

  <!-- 候选1 高亮 -->
  <rect x="60" y="100" width="400" height="40" rx="4" fill="#f0e4d0" stroke="#c08000" stroke-width="1.5"/>
  <text x="74" y="125" fill="#cc6600" font-size="13" font-weight="bold">1.</text>
  <text x="108" y="125" fill="#c08000" font-size="14" font-weight="bold">你好</text>
  <text x="168" y="125" fill="#999" font-size="12">nihao</text>
  <text x="300" y="125" fill="#6c757d" font-size="10">← hilited_candidate_back_color</text>

  <!-- hilite_padding_y 标注 -->
  <line x1="470" y1="96" x2="470" y2="100" stroke="#dc3545" stroke-width="1.2"/>
  <text x="475" y="100" fill="#dc3545" font-size="10">hilite_padding_y</text>
  <line x1="470" y1="140" x2="470" y2="146" stroke="#dc3545" stroke-width="1.2"/>

  <!-- candidate_spacing -->
  <line x1="260" y1="140" x2="260" y2="170" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="270" y="160" fill="#0d6efd" font-size="11" font-weight="bold">↕ candidate_spacing</text>

  <!-- 候选2 -->
  <rect x="60" y="172" width="400" height="40" rx="4" fill="none" stroke="#ddd"/>
  <text x="74" y="197" fill="#999" font-size="13">2.</text>
  <text x="108" y="197" fill="#808080" font-size="14">拟好</text>
  <text x="168" y="197" fill="#999" font-size="12">nihao</text>

  <!-- candidate_spacing -->
  <line x1="260" y1="212" x2="260" y2="240" stroke="#0d6efd" stroke-width="1.5"/>

  <!-- 候选3 -->
  <rect x="60" y="244" width="400" height="40" rx="4" fill="none" stroke="#ddd"/>
  <text x="74" y="269" fill="#999" font-size="13">3.</text>
  <text x="108" y="269" fill="#808080" font-size="14">你号</text>
  <text x="168" y="269" fill="#999" font-size="12">nihao</text>

  <!-- candidate_spacing -->
  <line x1="260" y1="284" x2="260" y2="312" stroke="#0d6efd" stroke-width="1.5"/>

  <!-- 候选4 -->
  <rect x="60" y="316" width="400" height="40" rx="4" fill="none" stroke="#ddd"/>
  <text x="74" y="341" fill="#999" font-size="13">4.</text>
  <text x="108" y="341" fill="#808080" font-size="14">逆好</text>
  <text x="168" y="341" fill="#999" font-size="12">nihao</text>

  <!-- margin_y 下 -->
  <line x1="260" y1="370" x2="260" y2="398" stroke="#dc3545" stroke-width="1.2"/>
  <text x="270" y="390" fill="#dc3545" font-size="11">↓ margin_y</text>
</svg>
