<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="Consolas, 'Courier New', monospace" font-size="12">
  <!-- 无阴影 -->
  <rect x="20" y="20" width="200" height="60" rx="6" fill="#ededed" stroke="#c3c3c3" stroke-width="2"/>
  <text x="50" y="55" fill="#808080" font-size="13">候选窗口</text>
  <text x="240" y="55" fill="#6c757d" font-size="12">shadow_radius = 0 → 不显示阴影</text>

  <!-- 有阴影 -->
  <rect x="28" y="128" width="200" height="80" rx="8" fill="#00000020"/>
  <rect x="20" y="120" width="200" height="80" rx="8" fill="#ededed" stroke="#c3c3c3" stroke-width="2"/>
  <text x="50" y="165" fill="#808080" font-size="13">候选窗口</text>

  <!-- shadow_offset 标注 -->
  <line x1="220" y1="200" x2="228" y2="208" stroke="#dc3545" stroke-width="1.2" stroke-dasharray="3"/>
  <text x="232" y="216" fill="#dc3545" font-size="11">shadow_offset_x/y ↘</text>

  <!-- shadow_radius 标注 -->
  <line x1="228" y1="148" x2="248" y2="148" stroke="#0d6efd" stroke-width="1.2" stroke-dasharray="3"/>
  <text x="252" y="136" fill="#0d6efd" font-size="11">shadow_radius</text>
  <text x="252" y="152" fill="#0d6efd" font-size="11">（模糊范围）</text>

  <!-- 说明 -->
  <text x="252" y="178" fill="#6c757d" font-size="12">shadow_color 必须非透明才可见</text>
  <text x="252" y="196" fill="#6c757d" font-size="12">全屏模式下强制为 0</text>
</svg>
